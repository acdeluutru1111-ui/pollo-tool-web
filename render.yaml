services:
  - type: web
    name: pollo-tool
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 4 --threads 8 --timeout 300 --worker-class gthread
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    plan: standard
